<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup Studio — gerador de mockups de marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0d0d0d;--panel:#141414;--line:#262626;--line2:#333;--tx:#e9e9e6;--mute:#8a8a86;--acc:#e9e9e6;--mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px/1.35 var(--sans);overflow:hidden}
#app{display:grid;grid-template-columns:1fr 372px;height:100vh}
#stage{position:relative;display:grid;grid-template-rows:auto 1fr;min-width:0}
.bar{display:flex;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;margin-right:auto;display:flex;gap:10px;align-items:baseline}
.brand small{color:var(--mute);font:11px var(--mono)}
button{appearance:none;border:1px solid var(--line2);background:#1b1b1b;color:var(--tx);font:500 12px var(--sans);padding:7px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
button:hover{background:#242424;border-color:#444}
button:active{transform:scale(.97)}
button.acc{background:#f1f0ec;color:#111;border-color:#f1f0ec}
button.acc:hover{background:#fff}
button.ghost{background:transparent}
button.sm{padding:4px 9px;font-size:11px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#view{position:relative;display:grid;place-items:center;overflow:hidden;padding:44px}
#out{display:block;box-shadow:0 30px 80px rgba(0,0,0,.6);background:#111;cursor:grab}
#out:active{cursor:grabbing}
.corner{position:absolute;font:11px var(--mono);color:var(--mute);pointer-events:none}
.corner.tl{top:14px;left:16px}.corner.tr{top:14px;right:16px;text-align:right}.corner.bl{bottom:14px;left:16px}.corner.br{bottom:14px;right:16px;text-align:right}
#scenes{display:flex;gap:6px;padding:0 14px 12px;overflow-x:auto;position:absolute;left:0;right:0;bottom:30px;justify-content:center;pointer-events:none}
#scenes button{pointer-events:auto;font-size:11px;padding:5px 10px;background:rgba(20,20,20,.85);backdrop-filter:blur(6px)}
#scenes button.on{background:#f1f0ec;color:#111;border-color:#f1f0ec}
#panel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;overflow-x:hidden}
#panel::-webkit-scrollbar{width:8px}#panel::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase}
summary::-webkit-details-marker{display:none}
summary .idx{font:11px var(--mono);color:var(--mute);width:18px}
summary .chev{margin-left:auto;color:var(--mute);transition:transform .2s}
details[open] summary .chev{transform:rotate(90deg)}
.lock{border:1px solid var(--line2);background:transparent;border-radius:6px;padding:2px 6px;font:10px var(--mono);color:var(--mute)}
.lock.on{color:#f1f0ec;border-color:#f1f0ec}
.rows{padding:2px 14px 14px;display:grid;gap:7px}
.row{display:grid;grid-template-columns:108px 1fr 54px;align-items:center;gap:8px}
.row.wide{grid-template-columns:108px 1fr}
.row label{color:#bdbdb8;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input[type=number]{width:100%;background:#0f0f0f;border:1px solid var(--line);color:var(--tx);font:11px var(--mono);padding:3px 5px;border-radius:5px;text-align:right}
.row select,.row input[type=text]{width:100%;background:#0f0f0f;border:1px solid var(--line);color:var(--tx);font:12px var(--sans);padding:5px 7px;border-radius:6px}
.row input[type=color]{width:100%;height:26px;border:1px solid var(--line);background:#0f0f0f;border-radius:6px;padding:2px}
.row input[type=checkbox]{accent-color:#f1f0ec;width:15px;height:15px;justify-self:start}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.swatches label{display:grid;gap:4px;font-size:10.5px;color:var(--mute)}
.swatches input{width:100%;height:30px;border:1px solid var(--line);background:#0f0f0f;border-radius:6px;padding:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,#f1f0ec var(--p,0%),#2c2c2c var(--p,0%));border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#f3f3ef;margin-top:-5px;border:0;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.hint{color:var(--mute);font-size:11px;line-height:1.4}
.thumb{display:flex;align-items:center;gap:8px}
.thumb img{width:34px;height:34px;object-fit:contain;background:#222;border-radius:6px;border:1px solid var(--line)}
#overlay{position:fixed;inset:0;background:rgba(5,5,5,.82);display:none;place-items:center;z-index:10}
#overlay.on{display:grid}
.ovbox{width:min(440px,90vw);border:1px solid var(--line2);background:#121212;border-radius:14px;padding:22px}
.ovbox h3{margin:0 0 6px;font:600 14px var(--sans)}
.prog{height:4px;background:#262626;border-radius:2px;overflow:hidden;margin:14px 0}
.prog i{display:block;height:100%;width:0;background:#f1f0ec}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:#1d1d1d;border:1px solid var(--line2);padding:8px 14px;border-radius:999px;transition:opacity .2s,transform .2s;pointer-events:none;z-index:11}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#loading{position:absolute;inset:0;display:grid;place-items:center;font:12px var(--mono);color:var(--mute);pointer-events:none}
</style>

<div id="app">
  <main id="stage">
    <header class="bar">
      <div class="brand">Mockup Studio <small>kits de marca · v1</small><a href="fotos.html" style="color:#8a8a86;font:11px var(--mono);text-decoration:none;border:1px solid #333;padding:2px 8px;border-radius:999px">Fotos ↗</a></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $=s=>document.querySelector(s);
const D2R=Math.PI/180, TAU=Math.PI*2;

/* =========================================================
   CORES
   ========================================================= */
const hex2rgb=h=>{h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)/255);};
const rgb2hex=a=>'#'+a.map(v=>Math.round(Math.min(1,Math.max(0,v))*255).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((v,i)=>v+(B[i]-v)*t));};
const lum=h=>{const [r,g,b]=hex2rgb(h);return .2126*r+.7152*g+.0722*b;};

/* =========================================================
   KITS DE MARCA
   ========================================================= */
const GOOGLE_FONTS=['Inter','Montserrat','Urbanist','DM Sans','Space Grotesk','Syne','Unbounded','Bricolage Grotesque','Archivo','Archivo Black','Manrope','Sora','Outfit','Instrument Serif','Playfair Display','Fraunces','DM Serif Display','Bebas Neue','Anton','JetBrains Mono','DM Mono'];
const loadedGF=new Set(['Inter','JetBrains Mono']);
function ensureGoogleFont(f){
  if(!f||loadedGF.has(f)||!GOOGLE_FONTS.includes(f)) return;
  loadedGF.add(f); const l=document.createElement('link'); l.rel='stylesheet';
  const single=['Archivo Black','Instrument Serif','Bebas Neue','Anton','DM Serif Display','DM Mono'].includes(f);
  l.href=`https://fonts.googleapis.com/css2?family=${f.replace(/ /g,'+')}${single?(f==='DM Mono'?':wght@400;500':''):':wght@300..800'}&display=swap`;
  document.head.appendChild(l);
}
const EMPTY_KIT={id:'',name:'Nova marca',brand:'Marca',headline:'Título da marca',sub:'Uma linha de apoio',cta:'Saiba mais',person:'Nome Sobrenome',role:'Cargo',
  contact1:'contato@marca.com',contact2:'Cidade · Estado',site:'marca.com',primary:'#1f5c45',dark:'#0e1512',light:'#f2f1ec',accent:'#7fd1a8',
  fontDisplay:'Space Grotesk',fontBody:'Inter',logo:'',logoMode:'tint',screenPhone:'',screenTablet:'',fonts:[]};
let kits={}, K=null;
const imgCache=new Map();
function loadImg(src){
  if(!src) return Promise.resolve(null);
  if(imgCache.has(src)) return imgCache.get(src);
  const p=new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src;});
  imgCache.set(src,p); return p;
}
const loadedFontFaces=new Set();
async function loadKitFonts(kit){
  for(const f of kit.fonts||[]){
    const key=f.family+'|'+f.url+'|'+f.weight; if(loadedFontFaces.has(key)) continue;
    try{ const ff=new FontFace(f.family,`url(${f.url})`,{weight:f.weight||'400'}); await ff.load(); document.fonts.add(ff); loadedFontFaces.add(key);}catch(e){console.warn('fonte',f,e);}
  }
  ensureGoogleFont(kit.fontDisplay); ensureGoogleFont(kit.fontBody);
  try{ await Promise.all([300,400,700,800].flatMap(w=>[document.fonts.load(`${w} 40px "${kit.fontDisplay}"`),document.fonts.load(`${w} 40px "${kit.fontBody}"`)])); }catch(e){}
}
function saveKits(){
  try{ localStorage.setItem('mockup-kits',JSON.stringify(kits)); localStorage.setItem('mockup-kit-cur',K.id); }
  catch(e){ toast('Sem espaço para salvar imagens grandes no navegador. Exporte o kit em .json.'); }
}
async function initKits(){
  try{ kits=JSON.parse(localStorage.getItem('mockup-kits')||'{}'); }catch(e){ kits={}; }
  if(!kits.niko){ try{ let r=await fetch('kits/niko/kit.local.json'); if(!r.ok) r=await fetch('kits/niko/kit.json'); if(r.ok) kits.niko=await r.json(); }catch(e){} }
  if(!kits.exemplo) kits.exemplo={...EMPTY_KIT,id:'exemplo',name:'Marca exemplo'};
  const cur=localStorage.getItem('mockup-kit-cur');
  K=kits[cur]||kits.niko||kits.exemplo;
}

/* logo: recorta o espaço vazio e tinge */
const logoCache=new Map();
let logoTrim=null;
async function prepareLogo(){
  logoCache.clear(); logoTrim=null;
  const im=await loadImg(K.logo); if(!im) return;
  const w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,1200/Math.max(w,h));
  const [c,x]=cv(Math.round(w*s),Math.round(h*s)); x.drawImage(im,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height).data; let x0=c.width,y0=c.height,x1=0,y1=0;
  // fundo branco opaco? usa luminância; senão, alfa
  const opaque=d[3]>250&&d[(d.length-1)]>250;
  for(let j=0;j<c.height;j++)for(let i=0;i<c.width;i++){const k=(j*c.width+i)*4;
    const on=opaque?(d[k]+d[k+1]+d[k+2])/3<200:d[k+3]>20; if(on){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j;}}
  if(x1<=x0){ logoTrim=c; return; }
  const [t,tx]=cv(x1-x0+1,y1-y0+1); tx.drawImage(c,-x0,-y0);
  if(opaque){ const id=tx.getImageData(0,0,t.width,t.height),dd=id.data; for(let k=0;k<dd.length;k+=4){const l=(dd[k]+dd[k+1]+dd[k+2])/3;dd[k+3]=255-l;dd[k]=dd[k+1]=dd[k+2]=0;} tx.putImageData(id,0,0); }
  logoTrim=t;
}
function logo(color){
  const key=color+'|'+K.logoMode;
  if(logoCache.has(key)) return logoCache.get(key);
  let c;
  if(logoTrim){
    [c]=cv(logoTrim.width,logoTrim.height); const x=c.getContext('2d'); x.drawImage(logoTrim,0,0);
    if(K.logoMode==='tint'){ x.globalCompositeOperation='source-in'; x.fillStyle=color; x.fillRect(0,0,c.width,c.height); }
  } else { // sem logo: wordmark com o nome
    const t=K.brand||K.name||'Marca'; const [m,mx]=cv(10,10); mx.font=`700 200px "${K.fontDisplay}"`; const w=mx.measureText(t).width;
    let x; [c,x]=cv(Math.ceil(w)+20,240); x.font=`700 200px "${K.fontDisplay}"`; x.fillStyle=color; x.textBaseline='middle'; x.fillText(t,10,125);
  }
  logoCache.set(key,c); return c;
}
function drawLogo(x,color,cx,cy,maxW,maxH,align='center'){
  const L=logo(color); const s=Math.min(maxW/L.width,maxH/L.height); const w=L.width*s,h=L.height*s;
  const lx=align==='left'?cx:align==='right'?cx-w:cx-w/2;
  x.drawImage(L,lx,cy-h/2,w,h); return {w,h};
}

/* =========================================================
   TEXTURAS (canvas)
   ========================================================= */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
let renderer;
function tex(c,srgb=true,rep){const t=new THREE.CanvasTexture(c); if(srgb)t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);} return t;}
function wrapText(x,text,maxW){const words=String(text||'').split(/\s+/);const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w; if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;} if(cur)lines.push(cur); return lines;}
function font(w,size,fam){return `${w} ${size}px "${fam}"`;}

function heightToNormal(hc,strength){
  const w=hc.width,h=hc.height,s=hc.getContext('2d').getImageData(0,0,w,h).data;
  const [c,x]=cv(w,h); const id=x.createImageData(w,h),d=id.data;
  const H=(i,j)=>s[((((j+h)%h)*w+((i+w)%w)))*4]/255;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const dx=(H(i+1,j)-H(i-1,j))*strength, dy=(H(i,j+1)-H(i,j-1))*strength, l=Math.hypot(dx,dy,1), k=(j*w+i)*4;
    d[k]=(-dx/l*.5+.5)*255; d[k+1]=(dy/l*.5+.5)*255; d[k+2]=(1/l*.5+.5)*255; d[k+3]=255;
  }
  x.putImageData(id,0,0); return c;
}
function heightMap(w,h,fn){const [c,x]=cv(w,h);const id=x.createImageData(w,h),d=id.data;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const v=Math.max(0,Math.min(1,fn(i,j)))*255,k=(j*w+i)*4;d[k]=d[k+1]=d[k+2]=v;d[k+3]=255;} x.putImageData(id,0,0);return c;}
const rnd=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s);};
const TEXC={};
function procTex(name){
  if(TEXC[name]) return TEXC[name];
  let c;
  if(name==='twill') c=heightToNormal(heightMap(512,512,(i,j)=>.5+.45*Math.sin((i+j)*TAU/8)+(rnd(i,j)-.5)*.15),3);
  if(name==='pique') c=heightToNormal(heightMap(512,512,(i,j)=>Math.abs(Math.sin(i*TAU/10)*Math.sin(j*TAU/10+(Math.floor(i/10)%2)*1.5))*.8+rnd(i,j)*.2),2.5);
  if(name==='rope') c=heightToNormal(heightMap(512,128,(i,j)=>.5+.5*Math.sin((i*1.0+j*2.0)*TAU/32)),4);
  if(name==='concrete'){ c=heightToNormal(heightMap(512,512,(i,j)=>{let v=0,a=.5;for(let o=1;o<=4;o++){v+=a*rnd(Math.floor(i/(32/o)),Math.floor(j/(32/o)));a*=.5;}return v*.6+rnd(i,j)*.4;}),1.2); }
  if(name==='brushed') c=heightToNormal(heightMap(512,512,(i,j)=>rnd(0,j)*.7+rnd(i>>3,j)*.3),.6);
  TEXC[name]=c; return c;
}
function texN(name,rep){const t=new THREE.CanvasTexture(procTex(name)); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); t.anisotropy=8; return t;}

/* ---------- peças gráficas da marca ---------- */
function onColor(bg){return lum(bg)>.5?K.dark:K.light;}
function cardFront(bg,v){
  const W=1700,H=1100,[c,x]=cv(W,H),fg=onColor(bg),m=110;
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'rgba(255,255,255,.07)');g.addColorStop(1,'rgba(0,0,0,.18)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle=fg;x.textBaseline='alphabetic';
  const small=font(400,34,K.fontBody);
  if(v===1){
    drawLogo(x,fg,W/2,H*.42,W*.5,H*.42);
    x.font=small;x.textAlign='center';x.globalAlpha=.75;x.fillText([K.site,K.contact1].filter(Boolean).join('  ·  '),W/2,H-m);x.globalAlpha=1;
  } else if(v===2){
    x.font=font(700,96,K.fontDisplay);x.textAlign='left';x.fillText(K.person,m,m+80);
    x.font=font(400,52,K.fontDisplay);x.globalAlpha=.7;x.fillText(K.role,m,m+150);x.globalAlpha=1;
    drawLogo(x,fg,m,H-m-70,W*.3,150,'left');
    x.font=small;x.textAlign='right';x.globalAlpha=.75;x.fillText(K.contact1,W-m,H-m-46);x.fillText(K.contact2||K.site,W-m,H-m);x.globalAlpha=1;
  } else {
    x.font=small;x.textAlign='left';x.globalAlpha=.75;x.fillText(K.contact1,m,m+34);x.fillText(K.contact2,m,m+80);x.globalAlpha=1;
    drawLogo(x,fg,W-m,m+70,260,150,'right');
    x.font=font(400,88,K.fontDisplay);x.fillText(K.person,m,H-m-100);x.fillText(K.role,m,H-m);
    x.font=small;x.textAlign='right';x.globalAlpha=.75;x.fillText(K.site,W-m,H*.52);x.globalAlpha=1;
  }
  return c;
}
function cardBack(bg){const W=1700,H=1100,[c,x]=cv(W,H);x.fillStyle=bg;x.fillRect(0,0,W,H);drawLogo(x,onColor(bg),W/2,H/2,W*.42,H*.45);return c;}

async function screen(kind,v){
  const src=kind==='phone'?K.screenPhone:K.screenTablet;
  const W=kind==='phone'?1179:1640, H=kind==='phone'?2556:2360;
  const [c,x]=cv(W,H);
  const im=await loadImg(src);
  if(im){ const s=Math.max(W/im.naturalWidth,H/im.naturalHeight); x.drawImage(im,(W-im.naturalWidth*s)/2,(H-im.naturalHeight*s)/2,im.naturalWidth*s,im.naturalHeight*s); }
  else{
    const bg=v===1?K.light:v===2?K.primary:K.dark, fg=onColor(bg), acc=v===2?K.light:(lum(bg)>.5?K.primary:K.accent), m=W*.08;
    x.fillStyle=bg;x.fillRect(0,0,W,H);
    // grafismo: leque de linhas (inspirado na ref. do tablet)
    x.save();x.translate(W*.95,H*.98);x.strokeStyle=acc;x.globalAlpha=.55;x.lineWidth=W*.004;

function roundRectGeo(w,h,r){
  const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
  const g=new THREE.ShapeGeometry(s,24),p=g.attributes.position,uv=g.attributes.uv;
  for(let i=0;i<p.count;i++)uv.setXY(i,(p.getX(i)+w/2)/w,(p.getY(i)+h/2)/h);
  return g;
}

function randomize(wild){
  commit();const rr=Math.random,base=SCENES[P.scene].defaults;
  for(const d of DEFS){
    if(d.r===false||locks[d.g])continue;
    if(d.t==='range'){
      let v;
      if(wild){ if(d.rwRel!=null){const c=base[d.k]??d.v;v=c+(rr()-.5)*2*d.rwRel;} else {const [a,b]=d.rw||[d.min,d.max];v=a+rr()*(b-a);} }
      else v=P[d.k]+(rr()-.5)*2*(d.lt??(d.max-d.min)*.08);
      v=Math.min(d.max,Math.max(d.min,v));v=Math.round(v/d.step)*d.step;P[d.k]=+v.toFixed(5);
    }else if(d.t==='select'){
      if(wild&&rr()<(d.pw??.6)){
        if(d.opts===ROLE_OPTS){ // cores coerentes: mais chance para as da marca
          const pool=['primaria','primaria_escura','escura','clara','primaria','acento','neutro_claro','neutro_escuro'];P[d.k]=pool[Math.floor(rr()*pool.length)];
        } else P[d.k]=d.opts[Math.floor(rr()*d.opts.length)][0];
      }
    }
  }
  // objeto e superfície não podem ter a mesma cor (o objeto some)
  if(P.objRole===P.surfRole&&P.scene!=='lightbox'){const alt={primaria:'escura',escura:'clara',clara:'primaria',primaria_escura:'clara',acento:'escura',neutro_claro:'primaria',neutro_escuro:'clara',neutro_medio:'escura',primaria_clara:'escura'};P.objRole=alt[P.objRole]||'clara';}
  if(['card','embroidery','tablet','phoneBlobs'].includes(P.scene)&&!locks.cor) P.bgRole=P.surfRole;
  needBuild=true;syncUI();commit();toast(wild?'⚡ Variação agressiva':'↻ Variação leve');
}

    res.hero.userData.base={rot:res.hero.rotation.clone(),pos:res.hero.position.clone()};
    const s=res.shadow;Object.assign(key.shadow.camera,{left:-s,right:s,top:s,bottom:-s,near:.1,far:60});key.shadow.camera.updateProjectionMatrix();
    $('#loading').style.display='none';
  }catch(e){console.error(e);toast('Erro ao montar a cena (veja o console)');}
  building=false;dirty=true;
}
function baseSize(){return P.format.split('x').map(Number);}
function camPose(t){
  const a=P.animAmp, ph=(t%P.loopDur)/P.loopDur, s=Math.sin(TAU*ph);
  const orbit=(playing||exportingVideo)&&(P.animMode==='orbit'||P.animMode==='both')?s*25*a:0;
  const push=(playing||exportingVideo)&&P.animMode==='push'?(.5-.5*Math.cos(TAU*ph))*.25*a:0;
  return {az:(P.camAz+orbit)*D2R,el:P.camEl*D2R,dist:cur.base*P.camDist*(1-push)*Math.tan(15*D2R)/Math.tan(P.fov/2*D2R)};
}
function applyScene(t){
  if(!cur)return;
  const tg=cur.target.clone();tg.y+=P.focusY*cur.base*.15;
  const {az,el,dist}=camPose(t);
  camera.fov=P.fov;camera.position.set(tg.x+dist*Math.cos(el)*Math.sin(az),tg.y+dist*Math.sin(el),tg.z+dist*Math.cos(el)*Math.cos(az));
  camera.lookAt(tg);controls.target.copy(tg);camera.updateProjectionMatrix();
  const h=cur.hero,b=h.userData.base;const ph=(t%P.loopDur)/P.loopDur;
  const fl=(playing||exportingVideo)&&(P.animMode==='float'||P.animMode==='both')?P.animAmp:0;
  const tilt=SCENES[P.scene].flat?0:P.objTilt*D2R;
  h.rotation.set(b.rot.x+tilt+Math.sin(TAU*ph)*.05*fl,b.rot.y+P.objRot*D2R+Math.cos(TAU*ph)*.08*fl,b.rot.z);
  h.position.set(b.pos.x,b.pos.y+Math.sin(TAU*ph)*.05*cur.base*.1*fl,b.pos.z);
  // luzes
  const warm=P.keyWarm,kc=new THREE.Color().setRGB(1+Math.min(0,warm)*.25,1-Math.abs(warm)*.08,1-Math.max(0,warm)*.3);
  const r=cur.base*1.5,ka=P.keyAz*D2R,ke=P.keyEl*D2R;
  key.position.set(tg.x+r*Math.cos(ke)*Math.sin(ka),tg.y+r*Math.sin(ke),tg.z+r*Math.cos(ke)*Math.cos(ka));key.target.position.copy(tg);
  key.color.copy(kc);key.intensity=P.keyInt;key.shadow.radius=P.keySoft;key.shadow.blurSamples=16;
  rim.position.set(tg.x-r*Math.sin(ka)*.8,tg.y+r*.5,tg.z-r*Math.cos(ka)*.8-r*.4);rim.intensity=P.rimInt;
  hemi.intensity=P.fillInt;scene.environmentIntensity=P.envInt;
  let bg=role(P.bgRole);bg=P.bgTone>0?mix(bg,'#ffffff',P.bgTone*.6):mix(bg,'#000000',-P.bgTone*.8);
  scene.background=new THREE.Color(bg);scene.userData.bg=bg;
  renderer.toneMappingExposure=P.exposure;
  cur.root.traverse(o=>{const ms=o.material?(Array.isArray(o.material)?o.material:[o.material]):[];ms.forEach(m=>{if(m.userData.glow)m.emissiveIntensity=P.glow;});});
  if(cur.hero.userData.glowLights)cur.hero.userData.glowLights.forEach(l=>l.intensity=3.5*P.glow);
}
controls.addEventListener('change',()=>{ if(!cur||applying)return;
  const tg=controls.target,v=camera.position.clone().sub(tg),d=v.length();
  P.camAz=Math.round(Math.atan2(v.x,v.z)/D2R);P.camEl=Math.round(Math.asin(v.y/d)/D2R);
  P.camDist=+(d/(cur.base*Math.tan(15*D2R)/Math.tan(P.fov/2*D2R))).toFixed(2);
  ['camAz','camEl','camDist'].forEach(k=>ctrls[k].set(P[k]));dirty=true;saveSoon();});
controls.addEventListener('end',()=>commit());
let applying=false;

// granulação
const [grainC,gx]=cv(256,256);{const id=gx.createImageData(256,256);for(let i=0;i<id.data.length;i+=4){const v=128+(Math.random()-.5)*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}gx.putImageData(id,0,0);}

function frameText(s){return String(s||'').replace(/\{marca\}/g,K.brand||K.name).replace(/\{site\}/g,K.site||K.contact1||'').replace(/\{kit\}/g,K.name).replace(/\{cena\}/g,SCENES[P.scene].label);}
function renderFrame(scale,t){
  const [bw,bh]=baseSize();const W=Math.round(bw*scale),H=Math.round(bh*scale);
  if(out.width!==W||out.height!==H){out.width=W;out.height=H;fitView();}
  renderer.setSize(W,H,false);camera.aspect=W/H;
  applying=true;applyScene(t);applying=false;
  renderer.render(scene,camera);
  const x=octx;x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';
  x.filter=`contrast(${P.contrast}) saturate(${P.saturate})`;x.drawImage(renderer.domElement,0,0,W,H);x.filter='none';
  if(P.vignette>0){const g=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.hypot(W,H)*.6);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${P.vignette*.75})`);x.fillStyle=g;x.fillRect(0,0,W,H);}
  if(P.grain>0){x.save();x.globalCompositeOperation='overlay';x.globalAlpha=P.grain*.5;const s=W/1080;x.scale(s,s);
    x.translate(-Math.random()*256,-Math.random()*256);x.fillStyle=x.createPattern(grainC,'repeat');x.fillRect(0,0,W/s+256,H/s+256);x.restore();}
  if(P.frameOn){const fs=P.frameSize*H,m=P.frameMargin*W;const ink=P.frameInk==='clara'?K.light:P.frameInk==='escura'?K.dark:(lum(scene.userData.bg||'#000')>.5?K.dark:K.light);
    x.save();x.fillStyle=ink;x.font=`500 ${fs}px "${K.fontBody}"`;
    x.textBaseline='top';x.textAlign='left';x.fillText(frameText(P.fTL),m,m);x.textAlign='right';x.fillText(frameText(P.fTR),W-m,m);
    x.textBaseline='bottom';x.textAlign='left';x.fillText(frameText(P.fBL),m,H-m);x.textAlign='right';x.fillText(frameText(P.fBR),W-m,H-m);x.restore();}
  return {W,H};
}
function fitView(){const v=$('#view'),pad=96;const [bw,bh]=baseSize();const s=Math.min((v.clientWidth-pad)/bw,(v.clientHeight-pad-30)/bh);
  out.style.width=Math.floor(bw*s)+'px';out.style.height=Math.floor(bh*s)+'px';$('#cRes').textContent=`${bw} × ${bh}`;}
window.addEventListener('resize',()=>{fitView();dirty=true;});

let playing=false,time=0,last=performance.now(),exporting=false,exportingVideo=false;
async function tick(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!exporting){
    if(needBuild&&!building) await rebuild();
    if(playing)time+=dt;
    if(cur&&(playing||dirty)){renderFrame(1,time);dirty=false;$('#cScene').textContent=SCENES[P.scene].label.toUpperCase();}
  }
  requestAnimationFrame(tick);
}
function setPlaying(v){playing=v;$('#bPlay').textContent=v?'❚❚ Parar':'▶ Animar';dirty=true;}

/* =========================================================
   EXPORTAÇÃO
   ========================================================= */
const stamp=()=>new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
const slug=s=>(s||'marca').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
async function exportPNG(){
  if(exporting||!cur)return;exporting=true;
  try{const {W,H}=renderFrame(+P.pngScale,time);const b=await new Promise(r=>out.toBlob(r,'image/png'));download(b,`${slug(K.name)}-${P.scene}-${W}x${H}.png`);toast(`PNG ${W}×${H} exportado`);}
  catch(e){console.error(e);toast('Falha ao exportar PNG');}
  exporting=false;dirty=true;
}
let cancelExport=false;
function overlay(on,t,i){$('#overlay').classList.toggle('on',on);if(t)$('#ovTitle').textContent=t;if(i!=null)$('#ovInfo').textContent=i;}
function progress(f){$('#ovBar').style.width=(f*100).toFixed(1)+'%';}
$('#ovCancel').onclick=()=>{cancelExport=true;};
async function exportAll(){
  if(exporting)return;cancelExport=false;const keep=JSON.stringify(P);const keys=Object.keys(SCENES);
  overlay(true,'Exportando todas as cenas…',`${keys.length} cenas com o kit "${K.name}", nos ajustes padrão de cada cena`);
  for(let i=0;i<keys.length&&!cancelExport;i++){
    progress(i/keys.length);P.scene=keys[i];applySceneDefaults();await rebuild();
    exporting=true;const {W,H}=renderFrame(+P.pngScale,0);const b=await new Promise(r=>out.toBlob(r,'image/png'));exporting=false;
    download(b,`${slug(K.name)}-${String(i+1).padStart(2,'0')}-${keys[i]}-${W}x${H}.png`);await new Promise(r=>setTimeout(r,350));
  }
  P=JSON.parse(keep);needBuild=true;syncUI();overlay(false);toast('Cenas exportadas');
}
async function exportVideo(){
  if(exporting||!cur)return;exporting=true;exportingVideo=true;cancelExport=false;
  const fps=+P.vidFps,sc=+P.vidScale,N=Math.round(P.loopDur*fps);const [bw,bh]=baseSize();const W=Math.floor(bw*sc/2)*2,H=Math.floor(bh*sc/2)*2;
  overlay(true,'Exportando vídeo…',`${W}×${H} · ${fps} fps · ${P.loopDur}s em loop`);progress(0);
  try{
    if(!('VideoEncoder' in window))throw new Error('sem WebCodecs');
    const mod=await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5/+esm');
    let cfg=null,kind=null;
    for(const [k,codec] of [['avc','avc1.640034'],['avc','avc1.640033'],['avc','avc1.42003e'],['vp9','vp09.00.51.08']]){
      const c={codec,width:W,height:H,bitrate:P.vidBitrate*1e6,framerate:fps,latencyMode:'quality'};if(k==='avc')c.avc={format:'avc'};
      try{if((await VideoEncoder.isConfigSupported(c)).supported){cfg=c;kind=k;break;}}catch(e){}
    }
    if(!cfg)throw new Error('sem codec');
    const muxer=new mod.Muxer({target:new mod.ArrayBufferTarget(),video:{codec:kind,width:W,height:H},fastStart:'in-memory'});
    let err=null;const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>err=e});enc.configure(cfg);
    for(let i=0;i<N&&!cancelExport&&!err;i++){
      renderFrame(sc,i/fps);const vf=new VideoFrame(out,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
      enc.encode(vf,{keyFrame:i%(fps*2)===0});vf.close();while(enc.encodeQueueSize>4)await new Promise(r=>setTimeout(r,2));
      if(i%2===0){progress(i/N);await new Promise(r=>requestAnimationFrame(r));}
    }
    if(err)throw err;
    if(cancelExport){enc.close();toast('Exportação cancelada');}
    else{await enc.flush();muxer.finalize();download(new Blob([muxer.target.buffer],{type:'video/mp4'}),`${slug(K.name)}-${P.scene}-${W}x${H}.mp4`);toast('MP4 exportado');}
  }catch(e){console.error(e);toast('Este navegador não exporta MP4 (precisa de WebCodecs, ex.: Chrome)');}
  overlay(false);exporting=false;exportingVideo=false;dirty=true;
}

/* atalhos */
$('#bPlay').onclick=()=>setPlaying(!playing);
$('#bLight').onclick=()=>randomize(false);$('#bWild').onclick=()=>randomize(true);
$('#bUndo').onclick=undo;$('#bRedo').onclick=redoFn;
$('#bPng').onclick=exportPNG;$('#bAll').onclick=exportAll;$('#bVid').onclick=exportVideo;
window.addEventListener('keydown',e=>{const tg=(e.target.tagName||'').toLowerCase();if((tg==='input'&&e.target.type!=='range')||tg==='select'||tg==='textarea')return;
  if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}
  else if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey)randomize(e.shiftKey);
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redoFn():undo();}
  else if(e.key.toLowerCase()==='s'&&!e.ctrlKey)exportPNG();});

await initKits();
await kitChanged(true);
buildUI();syncUI();fitView();
requestAnimationFrame(tick);
</script>
